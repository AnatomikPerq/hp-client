#
# Publishes the project website from `website/` to GitHub Pages.
#
# Trigger:
#   - push to main that touches `website/` or this file
#   - workflow_dispatch: republish by hand
#
# The site is static (HTML, CSS, JS, no build step), so the folder is uploaded
# as it is. Release links, sizes and hashes are fetched from the GitHub API in
# the visitor's browser: a new release needs no redeploy. Pages must be set to
# "GitHub Actions" in the repository settings once.

name: Pages

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website

      - id: deployment
        uses: actions/deploy-pages@v5
