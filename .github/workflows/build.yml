#
# Builds HYPER CLIENT: the Windows x64 installer and ZIP, and the Android
# split APKs (arm64-v8a, armeabi-v7a, x86_64).
#
# Trigger:
#   - workflow_dispatch: manual build, optionally from another libXray ref
#   - push to a tag matching `v*`: rebuilds a release from its tagged commit
#
# The fork ships the Windows x64 EXE build and Android APKs. Upstream's other
# platforms, MSIX/VCore and its store/winget publishing were removed. Nothing
# is published from here: the jobs upload workflow artifacts, and releases are
# created by hand (CLAUDE.md, "Git and releases").
#
# Android signs with the release key when the repository has the secrets
# ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and
# ANDROID_KEY_PASSWORD. Without them it signs with a throwaway key: the build
# is checked, but such APKs cannot update an installed release.
#
# Layout: build_scripts/app/builder.py resolves siblings from the parent of the
# App checkout, so this repository is checked out to `hp-client/` and our
# libXray fork to `libXray/` at the workspace root. Packages and the
# provenance receipt land in `<workspace>/output`.

name: Build
run-name: Build · ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      libxray_ref:
        description: AnatomikPerq/libXray ref to build libXray and the Core from
        required: true
        type: string
        default: main
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      GOARCH: amd64
      GOTOOLCHAIN: auto
      ONEXRAY_WINDOWS_ARCH: x64
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
        working-directory: hp-client
    steps:
      - uses: actions/checkout@v7
        with:
          path: hp-client

      - uses: actions/checkout@v7
        with:
          repository: AnatomikPerq/libXray
          ref: ${{ inputs.libxray_ref || 'main' }}
          path: libXray

      - uses: actions/setup-go@v7
        with:
          go-version-file: libXray/go.mod
          cache-dependency-path: libXray/go.sum

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          check-latest: true

      - uses: astral-sh/setup-uv@v7

      - name: Record revisions and build number
        run: |
          libxray_sha="$(git -C ../libXray rev-parse HEAD)"
          [[ "$libxray_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "ONEXRAY_LIBXRAY_SHA=$libxray_sha" >> "$GITHUB_ENV"

          # pubspec carries <version>+<base + BUILD_NUMBER>, as the local
          # release build writes it; CI reproduces the same version.
          version="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+)\+([0-9]+).*/\1/p' pubspec.yaml)"
          build="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+)\+([0-9]+).*/\2/p' pubspec.yaml)"
          base="$(cd build_scripts && python -c "from app.config import PROJECT_CONFIG; print(PROJECT_CONFIG['HyperClient']['build_number.base'])")"
          if [[ -z "$version" || -z "$build" ]] || (( build <= base )); then
            echo "pubspec.yaml needs version <marketing>+<build> with build > $base" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec version $version" >&2
            exit 1
          fi
          echo "BUILD_NUMBER=$((build - base))" >> "$GITHUB_ENV"

      - name: Setup Flutter
        run: bash build_scripts/setup_flutter.sh

      # The same toolchain as the local release build: gcc builds that emit
      # big-obj objects break cgo (readme/BUILD.md).
      - name: Install LLVM-MinGW
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $release = Invoke-RestMethod `
            -Headers $headers `
            -Uri "https://api.github.com/repos/mstorsjo/llvm-mingw/releases/latest"
          $asset = $release.assets |
            Where-Object { $_.name -match "^llvm-mingw-.+-ucrt-x86_64\.zip$" } |
            Select-Object -First 1
          if ($null -eq $asset) {
            throw "The latest LLVM-MinGW release has no x86_64 UCRT archive"
          }

          $archivePath = Join-Path $env:RUNNER_TEMP $asset.name
          $extractPath = Join-Path $env:RUNNER_TEMP "llvm-mingw"
          Write-Host "Downloading LLVM-MinGW $($release.tag_name): $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $archivePath
          "ONEXRAY_LLVM_MINGW_RELEASE=$($release.tag_name)" >> $env:GITHUB_ENV
          "ONEXRAY_LLVM_MINGW_SHA256=$((Get-FileHash $archivePath -Algorithm SHA256).Hash.ToLower())" >> $env:GITHUB_ENV
          Expand-Archive -LiteralPath $archivePath -DestinationPath $extractPath

          $binPath = Get-ChildItem -LiteralPath $extractPath -Directory |
            ForEach-Object { Join-Path $_.FullName "bin" } |
            Where-Object { Test-Path (Join-Path $_ "gcc.exe") } |
            Select-Object -First 1
          if ($null -eq $binPath) {
            throw "LLVM-MinGW bin directory was not found in $extractPath"
          }
          $binPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify CGo toolchain
        shell: pwsh
        run: |
          where.exe gcc.exe
          where.exe g++.exe

          $gccTarget = (& gcc.exe -dumpmachine).Trim()
          $gxxTarget = (& g++.exe -dumpmachine).Trim()
          $expectedTarget = '^x86_64-w64-(windows-gnu|mingw32)$'
          if ($gccTarget -notmatch $expectedTarget) {
            throw "Unexpected gcc target: $gccTarget"
          }
          if ($gxxTarget -notmatch $expectedTarget) {
            throw "Unexpected g++ target: $gxxTarget"
          }

      - name: Test build scripts
        working-directory: hp-client/build_scripts
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Install Fastforge
        shell: pwsh
        run: |
          dart pub global activate fastforge
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pubCache = $env:PUB_CACHE
          if (-not $pubCache) {
            $pubCache = Join-Path $env:LOCALAPPDATA "Pub\Cache"
          }
          (Join-Path $pubCache "bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify Fastforge
        run: python -c "import subprocess; subprocess.run(['fastforge.bat', '--version'], check=True)"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $toolDir = Join-Path $env:GITHUB_WORKSPACE "references/windows-build"
          New-Item -ItemType Directory -Force -Path $toolDir | Out-Null
          $installer = Join-Path $toolDir "innosetup-6.7.3.exe"
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe" -OutFile $installer
          $expectedHash = "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732"
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLower() -ne $expectedHash) {
            throw "Inno Setup installer hash mismatch"
          }
          $installDir = Join-Path $toolDir "inno-setup"
          $process = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList `
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/ALLUSERS", "/DIR=`"$installDir`""
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed: $($process.ExitCode)" }
          $compiler = Join-Path $installDir "ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "ISCC.exe was not installed" }
          "INNO_SETUP_PATH=$installDir" >> $env:GITHUB_ENV

      - name: Build
        run: uv run --project build_scripts python build_scripts/main.py HyperClient windows --windows-mode exe

      - name: Verify core CLI
        run: ./windows/app/HyperClientCore.exe -h

      - name: Upload EXE and ZIP artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: |
            output/HyperClient-windows-amd64.exe
            output/HyperClient-windows-amd64.zip
          if-no-files-found: error

      - name: Upload build provenance
        uses: actions/upload-artifact@v7
        with:
          name: provenance-windows-x64-exe
          path: output/provenance-windows-x64-exe.json
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      ANDROID_NDK_VERSION: 30.0.16248370
      GOTOOLCHAIN: auto
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
        working-directory: hp-client
    steps:
      - uses: actions/checkout@v7
        with:
          path: hp-client

      - uses: actions/checkout@v7
        with:
          repository: AnatomikPerq/libXray
          ref: ${{ inputs.libxray_ref || 'main' }}
          path: libXray

      - uses: actions/setup-go@v7
        with:
          go-version-file: libXray/go.mod
          cache-dependency-path: libXray/go.sum

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          check-latest: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: astral-sh/setup-uv@v7

      - name: Record revisions and build number
        run: |
          libxray_sha="$(git -C ../libXray rev-parse HEAD)"
          [[ "$libxray_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "ONEXRAY_LIBXRAY_SHA=$libxray_sha" >> "$GITHUB_ENV"

          version="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+)\+([0-9]+).*/\1/p' pubspec.yaml)"
          build="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+)\+([0-9]+).*/\2/p' pubspec.yaml)"
          base="$(cd build_scripts && python -c "from app.config import PROJECT_CONFIG; print(PROJECT_CONFIG['HyperClient']['build_number.base'])")"
          if [[ -z "$version" || -z "$build" ]] || (( build <= base )); then
            echo "pubspec.yaml needs version <marketing>+<build> with build > $base" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec version $version" >&2
            exit 1
          fi
          echo "BUILD_NUMBER=$((build - base))" >> "$GITHUB_ENV"

      # gomobile needs the NDK the App pins; Gradle fetches the platform and
      # build tools itself.
      - name: Install the Android NDK
        run: |
          # `yes` dies of SIGPIPE once sdkmanager is done, which pipefail
          # would count as a failure.
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      # tool/ffigen.dart finds the system libclang, and `dart run` builds the
      # host's native assets (cnativeapi wants GTK 3, X11 and Xi), as in
      # validate.yml.
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev pkg-config libgtk-3-dev libx11-dev libxi-dev

      - name: Setup Flutter
        run: bash build_scripts/setup_flutter.sh

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/release.jks"
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          else
            echo "::warning::No release key in secrets: the APKs are signed with a throwaway key"
            KEYSTORE_PASSWORD="$(openssl rand -hex 16)"
            KEY_PASSWORD="$KEYSTORE_PASSWORD"
            KEY_ALIAS=ci
            keytool -genkeypair -keystore "$keystore" -storetype PKCS12 \
              -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 4096 -validity 30 -dname "CN=HYPER CLIENT CI"
          fi
          mkdir -p android/keystore
          {
            echo "storeFile=$keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore/keystore.properties

      - name: Build
        run: uv run --project build_scripts python build_scripts/main.py HyperClient android

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" android/keystore/keystore.properties

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: output/HyperClient-*-android-*.apk
          if-no-files-found: error

      - name: Upload build provenance
        uses: actions/upload-artifact@v7
        with:
          name: provenance-android
          path: output/provenance-android-*.json
          if-no-files-found: error
